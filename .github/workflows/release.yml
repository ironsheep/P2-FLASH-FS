# Release: on a pushed vX.Y.Z tag, create a draft GitHub release whose page is the tag's
# CHANGELOG.md section and whose asset is the tracked cgsm_flash_file_demo.zip.
# tools/make_release.sh does the checks and prepares both; the draft is published by hand.

name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tagged tree
        uses: actions/checkout@v4

      - name: Check the tree and prepare the release assets
        run: tools/make_release.sh "${GITHUB_REF_NAME}" --out dist

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --draft \
            --verify-tag \
            --title "${GITHUB_REF_NAME}" \
            --notes-file dist/release-notes.md \
            dist/cgsm_flash_file_demo.zip
